services:
  - type: web
    name: trendpulse-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: TrendPulse AI API
      - key: CORS_ORIGINS
        value: https://trendpulse-ai.vercel.app
